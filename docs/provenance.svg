<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 590" role="img" aria-labelledby="title desc"><title id="title">Provenance and conceptual skill loading</title><desc id="desc">Historical Anthropic source to reference checkout to local documentation. Choose a source, load a selected skill, and optionally use helpers after reviewing component licenses. Setup not run.</desc><rect width="1030" height="590" fill="white"/><text x="30" y="37" fill="#263746" font-family="Arial, sans-serif" font-size="22"><tspan x="30" dy="0">PROVENANCE / historical snapshot</tspan></text><rect x="30" y="70" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="48" y="109" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="48" dy="0">Anthropic upstream</tspan></text><text x="48" y="148" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="48" dy="0">Historical source commit</tspan><tspan x="48" dy="20">69c0b1a · 2025-12-20</tspan></text><rect x="365" y="70" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="383" y="109" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="383" dy="0">Reference checkout</tspan></text><text x="383" y="148" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="383" dy="0">Same baseline commit</tspan><tspan x="383" dy="20">Inherited payload unchanged</tspan></text><rect x="700" y="70" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="718" y="109" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="718" dy="0">Local documentation</tspan></text><text x="718" y="148" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="718" dy="0">README + reference guide</tspan><tspan x="718" dy="20">Original editable diagram</tspan></text><rect x="30" y="330" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="48" y="369" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="48" dy="0">Choose a source</tspan></text><text x="48" y="408" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="48" dy="0">Upstream marketplace OR</tspan><tspan x="48" dy="20">host-supported local loading</tspan></text><rect x="365" y="330" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="383" y="369" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="383" dy="0">Load a selected skill</tspan></text><text x="383" y="408" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="383" dy="0">Discover name + description</tspan><tspan x="383" dy="20">Read instructions as needed</tspan></text><rect x="700" y="330" width="300" height="135" fill="#f3f6f8" stroke="#263746"/><text x="718" y="369" fill="#263746" font-family="Arial, sans-serif" font-size="21"><tspan x="718" dy="0">Optional helpers</tspan></text><text x="718" y="408" fill="#263746" font-family="Arial, sans-serif" font-size="16"><tspan x="718" dy="0">Resources, scripts, tools</tspan><tspan x="718" dy="20">Dependencies vary by skill</tspan></text><path d="M335 137h25m-7 -5l7 5l-7 5" fill="none" stroke="#263746"/><path d="M670 137h25m-7 -5l7 5l-7 5" fill="none" stroke="#263746"/><path d="M335 397h25m-7 -5l7 5l-7 5" fill="none" stroke="#263746"/><path d="M670 397h25m-7 -5l7 5l-7 5" fill="none" stroke="#263746"/><text x="30" y="257" fill="#263746" font-family="Arial, sans-serif" font-size="22"><tspan x="30" dy="0">SKILL LOADING / conceptual, not a runtime trace</tspan></text><text x="30" y="298" fill="#263746" font-family="Arial, sans-serif" font-size="18"><tspan x="30" dy="0">Check each component's license before loading or reusing it.</tspan></text><text x="30" y="513" fill="#263746" font-family="Arial, sans-serif" font-size="18"><tspan x="30" dy="0">Mixed rights: skill-level terms + third-party notices; no blanket root license.</tspan></text><text x="30" y="548" fill="#263746" font-family="Arial, sans-serif" font-size="18"><tspan x="30" dy="0">Local additions do not claim authorship of inherited skills. Setup NOT RUN.</tspan></text></svg>
